<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chọn pet</title>
<link rel="stylesheet" href="css/ui.css">
<style>
  body {
    user-select: none;
  }

  #wrap {
    padding: 22px 20px 18px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 15px;
    margin: 0 0 18px;
    text-align: center;
  }

  #cards {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .card {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: background 0.1s, border-color 0.1s;
  }

  .card:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .card.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .card img {
    width: 72px;
    height: 72px;
    image-rendering: pixelated;
    display: block;
  }

  .card-name {
    font-weight: 600;
  }

  #preview {
    position: relative;
    height: 150px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #previewFrame {
    display: none;
    width: 200px;
    height: 130px;
    border: 0;
    background: transparent;
    /* The sprite page is light-scheme; matching it keeps the frame transparent when this window is dark. */
    color-scheme: light;
    pointer-events: none;
  }

  #previewLabel {
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  #previewHint {
    color: var(--muted);
  }

  #next {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 9px 0;
  }
</style>
</head>
<body>
  <div id="wrap">
    <h1>Chọn người bạn đồng hành của bạn!</h1>

    <div id="cards">
      <div class="card" data-model="clawd">
        <svg width="72" height="72" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
          <g fill="#D87656">
            <rect x="10" y="0" width="60" height="40"/>
            <rect x="-5" y="14" width="15" height="13"/>
            <rect x="70" y="14" width="15" height="13"/>
            <rect x="10" y="40" width="7.5" height="15"/>
            <rect x="25" y="40" width="7.5" height="15"/>
            <rect x="47.5" y="40" width="7.5" height="15"/>
            <rect x="62.5" y="40" width="7.5" height="15"/>
          </g>
          <rect x="17.5" y="6" width="7.5" height="7.5" fill="#000000"/>
          <rect x="55" y="6" width="7.5" height="7.5" fill="#000000"/>
        </svg>
        <div class="card-name">🦀 Clawd</div>
      </div>

      <div class="card" data-model="cat">

          <rect x="-5" y="2.5" width="7.5" height="30" fill="#E8A258"/>
          <rect x="2.5" y="25" width="7.5" height="7.5" fill="#E8A258"/>
          <rect x="-5" y="17.5" width="7.5" height="3.75" fill="#C7803A"/>
          <rect class="tail" x="2.5" y="2.5" width="7.5" height="7.5" fill="#C7803A"/>
          <g class="leg leg-b" style="transform-origin: 13.75px 40px;">
            <rect x="10" y="35" width="7.5" height="12.5" fill="#E8A258"/>
            <rect x="10" y="47.5" width="7.5" height="7.5" fill="#F5EDE0"/>
          </g>
          <g class="leg leg-a" style="transform-origin: 28.75px 40px;">
            <rect x="25" y="35" width="7.5" height="12.5" fill="#E8A258"/>
            <rect x="25" y="47.5" width="7.5" height="7.5" fill="#F5EDE0"/>
          </g>
          <g class="leg leg-b" style="transform-origin: 43.75px 40px;">
            <rect x="40" y="35" width="7.5" height="12.5" fill="#E8A258"/>
            <rect x="40" y="47.5" width="7.5" height="7.5" fill="#F5EDE0"/>
          </g>
          <g class="leg leg-a paw" style="transform-origin: 58.75px 40px;">
            <rect x="55" y="35" width="7.5" height="12.5" fill="#E8A258"/>
            <rect x="55" y="47.5" width="7.5" height="7.5" fill="#F5EDE0"/>
          </g>
          <rect x="10" y="17.5" width="52.5" height="22.5" fill="#E8A258"/>
          <rect x="17.5" y="32.5" width="37.5" height="7.5" fill="#F5EDE0"/>
          <rect x="17.5" y="17.5" width="7.5" height="15" fill="#C7803A"/>
          <rect x="32.5" y="17.5" width="7.5" height="15" fill="#C7803A"/>
          <rect x="47.5" y="2.5" width="37.5" height="22.5" fill="#E8A258"/>
          <rect x="47.5" y="-5" width="7.5" height="7.5" fill="#E8A258"/>
          <rect x="77.5" y="-5" width="7.5" height="7.5" fill="#E8A258"/>
          <rect x="49.4" y="-2.5" width="3.75" height="5" fill="#E8A0A0"/>
          <rect x="79.4" y="-2.5" width="3.75" height="5" fill="#E8A0A0"/>
          <rect x="62.5" y="2.5" width="7.5" height="5" fill="#C7803A"/>
          <rect x="55" y="17.5" width="22.5" height="7.5" fill="#F5EDE0"/>
          <rect x="63.75" y="17.5" width="5" height="3.75" fill="#E06C9F"/>
          <g>
          <rect class="eye" x="56.25" y="10" width="5" height="7.5" fill="#000000"/>
          <rect class="eye" x="71.25" y="10" width="5" height="7.5" fill="#000000"/>
        </g>
        </svg>
        <div class="card-name">🐱 Mèo</div>
      </div>

      <div class="card" data-model="sheep">
        <svg width="72" height="72" viewBox="-6 -8 94 66" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
          <g class="leg leg-a" style="transform-origin: 13.75px 40px;">
            <rect x="10" y="35" width="7.5" height="20" fill="#6E665F"/>
            <rect x="10" y="51.25" width="7.5" height="3.75" fill="#403B37"/>
          </g>
          <g class="leg leg-b" style="transform-origin: 26.25px 40px;">
            <rect x="22.5" y="35" width="7.5" height="20" fill="#6E665F"/>
            <rect x="22.5" y="51.25" width="7.5" height="3.75" fill="#403B37"/>
          </g>
          <g class="leg leg-b" style="transform-origin: 38.75px 40px;">
            <rect x="35" y="35" width="7.5" height="20" fill="#6E665F"/>
            <rect x="35" y="51.25" width="7.5" height="3.75" fill="#403B37"/>
          </g>
          <g class="leg leg-a" style="transform-origin: 51.25px 40px;">
            <rect x="47.5" y="35" width="7.5" height="20" fill="#6E665F"/>
            <rect x="47.5" y="51.25" width="7.5" height="3.75" fill="#403B37"/>
          </g>
          <rect x="10" y="2.5" width="37.5" height="7.5" fill="#F4F0E6"/>
          <rect x="2.5" y="10" width="52.5" height="22.5" fill="#F4F0E6"/>
          <rect x="10" y="32.5" width="45" height="7.5" fill="#F4F0E6"/>
          <rect x="5" y="13.75" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="20" y="16.25" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="36.25" y="13.75" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="26.25" y="5" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="10" y="25" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="32.5" y="27.5" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="46.25" y="22.5" width="7.5" height="3.75" fill="#E4DECE"/>
          <rect x="10" y="36.25" width="45" height="3.75" fill="#E4DECE"/>
          <rect x="55" y="10" width="22.5" height="22.5" fill="#6E665F"/>
          <rect x="57.5" y="5" width="17.5" height="7.5" fill="#F4F0E6"/>
          <rect x="57.5" y="10" width="17.5" height="2.5" fill="#E4DECE"/>
          <rect x="77.5" y="15" width="5" height="7.5" fill="#6E665F"/>
          <rect x="50" y="15" width="5" height="7.5" fill="#6E665F"/>
          <rect x="59" y="23.75" width="14.5" height="7.5" fill="#A59B90"/>
          <rect x="63.75" y="25" width="5" height="3.75" fill="#403B37"/>
          <g>
          <rect class="eye" x="59" y="15" width="5" height="5" fill="#F4F0E6"/>
          <rect class="eye" x="68.5" y="15" width="5" height="5" fill="#F4F0E6"/>
        </g>
        </svg>
        <div class="card-name">🐑 Cừu</div>
      </div>
    </div>

    <div id="preview">
      <span id="previewLabel"></span>
      <span id="previewHint">Chọn một pet để xem trước</span>
      <iframe id="previewFrame" title="Xem trước" scrolling="no" tabindex="-1"></iframe>
    </div>

    <button id="next" class="btn primary" disabled>Tiếp tục →</button>
  </div>
  <script src="model-picker.js"></script>
</body>
</html>
